# MathBoard
# SPDX-License-Identifier: AGPL-3.0-or-later
# A published public desktop release proposes a reviewed cask update, never a merge.
name: Propose Homebrew tap update

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathboard-homebrew-tap-update
  cancel-in-progress: false

jobs:
  propose:
    name: Verify assets and open or update tap PR
    if: github.repository == 'giacomobartoloni/mathboard'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out MathBoard tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out target tap main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: giacomobartoloni/homebrew-tap
          ref: main
          path: homebrew-tap
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version

      - name: Select latest approved public release and verify both DMGs
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/homebrew-tap/update-cask.mjs homebrew-tap/Casks/mathboard.rb

      - name: Create narrowly scoped GitHub App token
        if: steps.prepare.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MATHBOARD_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.MATHBOARD_TAP_APP_PRIVATE_KEY }}
          owner: giacomobartoloni
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Refuse unexpected automation branch or PR ownership
        if: steps.prepare.outputs.changed == 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAP_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: node tools/homebrew-tap/update-cask.mjs --guard

      - name: Create or refresh cask-only pull request
        if: steps.prepare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch-token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap
          base: main
          branch: automation/update-mathboard
          add-paths: Casks/mathboard.rb
          commit-message: "chore: update MathBoard cask to ${{ steps.prepare.outputs.version }}"
          title: "chore: update MathBoard cask to ${{ steps.prepare.outputs.version }}"
          body: |
            <!-- MathBoard Tap Automation -->
            This pull request proposes the latest published MathBoard desktop release:
            ${{ steps.prepare.outputs.release_url }}

            - Apple Silicon DMG: MathBoard_${{ steps.prepare.outputs.version }}_aarch64.dmg
              SHA-256: ${{ steps.prepare.outputs.arm_sha }}
            - Intel DMG: MathBoard_${{ steps.prepare.outputs.version }}_x64.dmg
              SHA-256: ${{ steps.prepare.outputs.intel_sha }}

            Both DMGs were downloaded and hashed against the published SHA256SUMS.txt.
            The public beta is **unsigned and unnotarized**. Checksums are an
            integrity check, not independent publisher authentication.
            **Human review and tap CI are required before manual merge.**
            This workflow does not certify native macOS installation or GUI QA.
