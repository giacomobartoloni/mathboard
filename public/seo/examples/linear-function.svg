<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" role="img" aria-labelledby="linear-graph-title linear-graph-desc">
  <title id="linear-graph-title">Graph of y equals 2x plus 1</title>
  <desc id="linear-graph-desc">On a coordinate grid, a rising straight line passes through the y-intercept (0, 1), then (1, 3) and (2, 5). A right-angle annotation shows that moving one unit right raises y by two units.</desc>
  <rect x="1" y="1" width="858" height="538" rx="16" fill="#fffdf9" stroke="#dedbd3" stroke-width="2"/>
  <text x="44" y="34" fill="#304240" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="700">A linear function, step by step</text>
  <rect x="63" y="53" width="516" height="444" rx="10" fill="#ffffff" stroke="#d5dfdd" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <line x1="80" y1="60" x2="80" y2="480" stroke="#e5ebea" stroke-width="1"/>
    <line x1="140" y1="60" x2="140" y2="480" stroke="#e5ebea" stroke-width="1"/>
    <line x1="200" y1="60" x2="200" y2="480" stroke="#e5ebea" stroke-width="1"/>
    <line x1="260" y1="60" x2="260" y2="480" stroke="#263e47" stroke-width="2.6"/>
    <line x1="320" y1="60" x2="320" y2="480" stroke="#e5ebea" stroke-width="1"/>
    <line x1="380" y1="60" x2="380" y2="480" stroke="#e5ebea" stroke-width="1"/>
    <line x1="440" y1="60" x2="440" y2="480" stroke="#e5ebea" stroke-width="1"/>
    <line x1="500" y1="60" x2="500" y2="480" stroke="#e5ebea" stroke-width="1"/>
    <line x1="560" y1="60" x2="560" y2="480" stroke="#e5ebea" stroke-width="1"/>
    <line x1="80" y1="60" x2="560" y2="60" stroke="#e5ebea" stroke-width="1"/>
    <line x1="80" y1="120" x2="560" y2="120" stroke="#e5ebea" stroke-width="1"/>
    <line x1="80" y1="180" x2="560" y2="180" stroke="#e5ebea" stroke-width="1"/>
    <line x1="80" y1="240" x2="560" y2="240" stroke="#e5ebea" stroke-width="1"/>
    <line x1="80" y1="300" x2="560" y2="300" stroke="#e5ebea" stroke-width="1"/>
    <line x1="80" y1="360" x2="560" y2="360" stroke="#e5ebea" stroke-width="1"/>
    <line x1="80" y1="420" x2="560" y2="420" stroke="#263e47" stroke-width="2.6"/>
    <line x1="80" y1="480" x2="560" y2="480" stroke="#e5ebea" stroke-width="1"/>
    <text x="80" y="439" text-anchor="middle" font-size="15" fill="#4f6267">-3</text>
    <text x="140" y="439" text-anchor="middle" font-size="15" fill="#4f6267">-2</text>
    <text x="200" y="439" text-anchor="middle" font-size="15" fill="#4f6267">-1</text>
    
    <text x="320" y="439" text-anchor="middle" font-size="15" fill="#4f6267">1</text>
    <text x="380" y="439" text-anchor="middle" font-size="15" fill="#4f6267">2</text>
    <text x="440" y="439" text-anchor="middle" font-size="15" fill="#4f6267">3</text>
    <text x="500" y="439" text-anchor="middle" font-size="15" fill="#4f6267">4</text>
    <text x="560" y="439" text-anchor="middle" font-size="15" fill="#4f6267">5</text>
    <text x="245" y="66" text-anchor="end" font-size="15" fill="#4f6267">6</text>
    <text x="245" y="126" text-anchor="end" font-size="15" fill="#4f6267">5</text>
    <text x="245" y="186" text-anchor="end" font-size="15" fill="#4f6267">4</text>
    <text x="245" y="246" text-anchor="end" font-size="15" fill="#4f6267">3</text>
    <text x="245" y="306" text-anchor="end" font-size="15" fill="#4f6267">2</text>
    <text x="245" y="366" text-anchor="end" font-size="15" fill="#4f6267">1</text>
    
    <text x="245" y="486" text-anchor="end" font-size="15" fill="#4f6267">-1</text>
    <text x="584" y="416" fill="#263e47" font-size="19" font-weight="700">x</text>
    <text x="276" y="80" fill="#263e47" font-size="19" font-weight="700">y</text>
    <text x="246" y="438" fill="#263e47" font-size="16" text-anchor="end">0</text>
    <path d="M 200 480 L 410 60" fill="none" stroke="#087b69" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 260 360 H 320 V 240" fill="none" stroke="#da8244" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7"/>
    <text x="273" y="394" fill="#a34a15" font-size="16" font-weight="700">run 1</text>
    <text x="330" y="301" fill="#a34a15" font-size="16" font-weight="700">rise 2</text>
    <circle cx="260" cy="360" r="7" fill="#f8fbfa" stroke="#087b69" stroke-width="3"/><text x="192" y="339" font-size="16" fill="#164c4b" font-weight="700">(0, 1)</text>
    <circle cx="320" cy="240" r="7" fill="#f8fbfa" stroke="#087b69" stroke-width="3"/><text x="338" y="224" font-size="16" fill="#164c4b" font-weight="700">(1, 3)</text>
    <circle cx="380" cy="120" r="7" fill="#f8fbfa" stroke="#087b69" stroke-width="3"/><text x="393" y="108" font-size="16" fill="#164c4b" font-weight="700">(2, 5)</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="612" y="74" width="210" height="370" rx="14" fill="#edf5f1" stroke="#b8d5c9"/>
    <text x="638" y="113" font-size="15" fill="#31594e" font-weight="700">SLOPE-INTERCEPT</text>
    <text x="638" y="149" font-size="30" fill="#183d36" font-weight="700">y = 2x + 1</text>
    <line x1="638" y1="169" x2="793" y2="169" stroke="#bad2c8"/>
    <text x="638" y="205" font-size="16" fill="#31594e" font-weight="700">START AT</text>
    <text x="638" y="232" font-size="22" fill="#183d36">(0, 1)</text>
    <text x="638" y="264" font-size="14" fill="#527064">on the y-axis</text>
    <line x1="638" y1="285" x2="793" y2="285" stroke="#bad2c8"/>
    <text x="638" y="318" font-size="16" fill="#31594e" font-weight="700">THEN MOVE</text>
    <text x="638" y="349" font-size="22" fill="#183d36">1 right,</text>
    <text x="638" y="378" font-size="22" fill="#183d36">2 up</text>
    <text x="638" y="410" font-size="14" fill="#527064">Repeat for more points</text>
  </g>
  <text x="44" y="522" fill="#596766" font-family="Arial, Helvetica, sans-serif" font-size="13">Original teaching diagram · axes and line are drawn to a consistent unit scale</text>
</svg>