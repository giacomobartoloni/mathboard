[package]
name = "mathboard"
version = "1.3.0"
description = "Interactive digital whiteboard for mathematical notation and LaTeX"
authors = ["Giacomo Bartoloni"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/giacomobartoloni/mathboard"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2"
