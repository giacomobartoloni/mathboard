[package]
name = "mathboard"
version = "1.10.0"
description = "Interactive digital whiteboard for mathematical notation and LaTeX"
authors = ["Giacomo Bartoloni"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/giacomobartoloni/mathboard"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Never enabled in normal distribution builds.
phase-c-verification = ["dep:windows-sys"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2"
uuid = { version = "1.26.1", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
base64 = "0.22.1"
png = "0.18.1"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
